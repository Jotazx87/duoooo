<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachorrinho 3D - Feito pelo Jota</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;800&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #e0e7ff 100%);
            user-select: none;
        }
        canvas {
            display: block;
        }
        .speech-bubble {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #ffffff;
            border: 3px solid #f472b6;
            border-radius: 20px;
            padding: 14px 24px;
            font-weight: 800;
            color: #db2777;
            font-size: 1.1rem;
            box-shadow: 0 12px 30px rgba(244, 114, 182, 0.35);
            white-space: nowrap;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 50;
            text-align: center;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: #f472b6 transparent transparent transparent;
        }
        .speech-bubble.show {
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between items-center">

    <header class="pt-8 text-center z-10 pointer-events-none">
        <h1 class="text-3xl md:text-4xl font-extrabold text-pink-600 drop-shadow-md">Mensagem Especial 🐾</h1>
        <p class="text-gray-600 mt-1 font-semibold">Alguém muito fofo veio te dar um recado!</p>
    </header>

    <!-- Balão de Fala flutuante -->
    <div id="speech" class="speech-bubble">
        <span id="speech-text"></span>
    </div>

    <footer class="pb-6 text-center z-10 pointer-events-none text-sm text-pink-700 font-extrabold drop-shadow-sm tracking-wide">
        ✨ Feito pelo Jota para a melhor pessoa ✨
    </footer>

    <script>
        let scene, camera, renderer;
        let dogGroup, bodyGroup, headGroup, tailGroup;
        let frontLeftLeg, frontRightLeg, backLeftLeg, backRightLeg;
        let clouds = [];
        let flowers = [];
        
        let animState = 'WALK_IN'; 
        let animTimer = 0;
        let clock = new THREE.Clock();

        const speechBubble = document.getElementById('speech');
        const speechText = document.getElementById('speech-text');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfde2e4);
            scene.fog = new THREE.FogExp2(0xfde2e4, 0.018);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 14);
            camera.lookAt(0, 1.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Iluminação aconchegante
            const ambientLight = new THREE.AmbientLight(0xfff0f5, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            dirLight.position.set(12, 22, 14);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xf472b6, 1.3, 25);
            pointLight.position.set(-6, 6, 5);
            scene.add(pointLight);

            createEnhancedEnvironment();

            createDog();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        function createEnhancedEnvironment() {
            // Chão principal circular com graminha exuberante
            const floorGeo = new THREE.CylinderGeometry(10, 10, 0.6, 36);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x74ec94, roughness: 0.85 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.3;
            floor.receiveShadow = true;
            scene.add(floor);

            // Anel decorativo de trilha/pedrinhas
            const pathGeo = new THREE.RingGeometry(9.8, 12, 36);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.9 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.y = -0.28;
            scene.add(path);

            // Árvores detalhadas ao fundo (estilo pinheiros e redondas)
            for (let i = 0; i < 9; i++) {
                const angle = (i / 9) * Math.PI * 2;
                const distance = 8.2;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance - 1;
                if (i % 2 === 0) {
                    createPineTree(x, 0, z);
                } else {
                    createRoundTree(x, 0, z);
                }
            }

            // Cercadinho fofo ao fundo com postes duplos
            for (let i = -6; i <= 6; i++) {
                if (Math.abs(i) > 2) {
                    createFence(i * 1.15, 0, -7.2);
                }
            }

            // Arbustos e canteiros de flores detalhados
            for (let i = 0; i < 22; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 3.5 + Math.random() * 5.2;
                createFlowerCluster(Math.cos(angle) * dist, Math.sin(angle) * dist);
            }

            // Pedrinhas decorativas e cogumelos fofos no gramado
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 2 + Math.random() * 5;
                createMushroom(Math.cos(angle) * dist, Math.sin(angle) * dist);
            }

            // Nuvens fofas e volumosas flutuando no céu
            for (let i = 0; i < 6; i++) {
                createCloud((Math.random() - 0.5) * 24, 7.5 + Math.random() * 3.5, -9 - Math.random() * 7);
            }
        }

        function createRoundTree(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.35, 1.6, 6),
                new THREE.MeshStandardMaterial({ color: 0x9a3412 })
            );
            trunk.position.y = 0.8;
            trunk.castShadow = true;
            group.add(trunk);

            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.6 });
            const l1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.3), leavesMat);
            l1.position.y = 2.0;
            l1.castShadow = true;
            group.add(l1);

            const l2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9), new THREE.MeshStandardMaterial({ color: 0x34d399 }));
            l2.position.set(0.4, 2.4, 0.2);
            group.add(l2);

            scene.add(group);
        }

        function createPineTree(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2, 0.3, 1.4, 6),
                new THREE.MeshStandardMaterial({ color: 0x7c2d12 })
            );
            trunk.position.y = 0.7;
            trunk.castShadow = true;
            group.add(trunk);

            const pineMat = new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.7 });
            const cone1 = new THREE.Mesh(new THREE.ConeGeometry(1.1, 1.8, 6), pineMat);
            cone1.position.y = 1.8;
            cone1.castShadow = true;
            group.add(cone1);

            const cone2 = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 6), pineMat);
            cone2.position.y = 2.7;
            group.add(cone2);

            scene.add(group);
        }

        function createFence(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const postMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.8 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.3, 0.2), postMat);
            p.position.y = 0.65;
            group.add(p);

            const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.08), postMat);
            b1.position.set(0.6, 0.9, 0);
            group.add(b1);

            const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 0.08), postMat);
            b2.position.set(0.6, 0.45, 0);
            group.add(b2);

            scene.add(group);
        }

        function createFlowerCluster(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            // Folhagem base do arbusto
            const bush = new THREE.Mesh(
                new THREE.DodecahedronGeometry(0.4),
                new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.9 })
            );
            bush.position.y = 0.2;
            group.add(bush);

            // Florzinhas coloridas em cima
            const colors = [0xf472b6, 0xfbbf24, 0xc084fc, 0x38bdf8, 0xffffff];
            for (let i = 0; i < 3; i++) {
                const flower = new THREE.Mesh(
                    new THREE.SphereGeometry(0.12, 6, 6),
                    new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] })
                );
                flower.position.set((Math.random() - 0.5) * 0.3, 0.35 + Math.random() * 0.15, (Math.random() - 0.5) * 0.3);
                group.add(flower);
            }

            scene.add(group);
        }

        function createMushroom(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const stem = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.08, 0.3, 6),
                new THREE.MeshStandardMaterial({ color: 0xfffbeb })
            );
            stem.position.y = 0.15;
            group.add(stem);

            const cap = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
                new THREE.MeshStandardMaterial({ color: 0xef4444 })
            );
            cap.position.y = 0.3;
            group.add(cap);

            scene.add(group);
        }

        function createCloud(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, transparent: true, opacity: 0.9 });
            const p1 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8), cloudMat);
            const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), cloudMat);
            p2.position.set(0.8, 0.2, 0);
            const p3 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), cloudMat);
            p3.position.set(-0.8, 0.1, 0);

            group.add(p1, p2, p3);
            scene.add(group);
            clouds.push(group);
        }

        function createDog() {
            dogGroup = new THREE.Group();
            scene.add(dogGroup);

            const furMaterial = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.6 });
            const lightFurMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.5 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.3 });
            const earMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.6 });
            const noseMaterial = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2 });
            const blushMat = new THREE.MeshStandardMaterial({ color: 0xf472b6, roughness: 0.4 });

            bodyGroup = new THREE.Group();
            dogGroup.add(bodyGroup);

            const bodyGeo = new THREE.BoxGeometry(1.6, 1.1, 2.2);
            const bodyMesh = new THREE.Mesh(bodyGeo, furMaterial);
            bodyMesh.position.y = 1.1;
            bodyMesh.castShadow = true;
            bodyGroup.add(bodyMesh);

            const chestGeo = new THREE.BoxGeometry(1.4, 0.9, 0.5);
            const chestMesh = new THREE.Mesh(chestGeo, lightFurMat);
            chestMesh.position.set(0, 1.0, 0.95);
            bodyGroup.add(chestMesh);

            tailGroup = new THREE.Group();
            tailGroup.position.set(0, 1.6, -1.1);
            const tailGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const tailMesh = new THREE.Mesh(tailGeo, furMaterial);
            tailMesh.position.y = 0.4;
            tailMesh.castShadow = true;
            tailGroup.add(tailMesh);
            bodyGroup.add(tailGroup);

            headGroup = new THREE.Group();
            headGroup.position.set(0, 1.8, 1.1);
            bodyGroup.add(headGroup);

            const headGeo = new THREE.BoxGeometry(1.4, 1.3, 1.3);
            const headMesh = new THREE.Mesh(headGeo, furMaterial);
            headMesh.castShadow = true;
            headGroup.add(headMesh);

            const snoutGeo = new THREE.BoxGeometry(0.8, 0.5, 0.6);
            const snoutMesh = new THREE.Mesh(snoutGeo, lightFurMat);
            snoutMesh.position.set(0, -0.2, 0.7);
            headGroup.add(snoutMesh);

            const noseGeo = new THREE.BoxGeometry(0.3, 0.2, 0.2);
            const noseMesh = new THREE.Mesh(noseGeo, noseMaterial);
            noseMesh.position.set(0, -0.1, 1.02);
            headGroup.add(noseMesh);

            const earGeo = new THREE.BoxGeometry(0.4, 0.8, 0.3);
            
            const leftEar = new THREE.Mesh(earGeo, earMaterial);
            leftEar.position.set(-0.8, 0.7, 0);
            leftEar.rotation.z = 0.2;
            headGroup.add(leftEar);

            const rightEar = new THREE.Mesh(earGeo, earMaterial);
            rightEar.position.set(0.8, 0.7, 0);
            rightEar.rotation.z = -0.2;
            headGroup.add(rightEar);

            const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.1);
            const leftEye = new THREE.Mesh(eyeGeo, darkMat);
            leftEye.position.set(-0.35, 0.2, 0.68);
            headGroup.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, darkMat);
            rightEye.position.set(0.35, 0.2, 0.68);
            headGroup.add(rightEye);

            const cheekGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
            const leftCheek = new THREE.Mesh(cheekGeo, blushMat);
            leftCheek.position.set(-0.55, -0.1, 0.67);
            headGroup.add(leftCheek);

            const rightCheek = new THREE.Mesh(cheekGeo, blushMat);
            rightCheek.position.set(0.55, -0.1, 0.67);
            headGroup.add(rightCheek);

            const legGeo = new THREE.BoxGeometry(0.35, 1.0, 0.35);

            backLeftLeg = new THREE.Mesh(legGeo, earMaterial);
            backLeftLeg.position.set(-0.5, 0.5, -0.7);
            backLeftLeg.castShadow = true;
            bodyGroup.add(backLeftLeg);

            backRightLeg = new THREE.Mesh(legGeo, earMaterial);
            backRightLeg.position.set(0.5, 0.5, -0.7);
            backRightLeg.castShadow = true;
            bodyGroup.add(backRightLeg);

            frontLeftLeg = new THREE.Mesh(legGeo, furMaterial);
            frontLeftLeg.position.set(-0.5, 0.5, 0.7);
            frontLeftLeg.castShadow = true;
            bodyGroup.add(frontLeftLeg);

            frontRightLeg = new THREE.Mesh(legGeo, furMaterial);
            frontRightLeg.geometry.translate(0, -0.4, 0);
            frontRightLeg.position.set(0.5, 1.0, 0.7);
            frontRightLeg.castShadow = true;
            bodyGroup.add(frontRightLeg);

            dogGroup.position.set(-13, 0, 0);
            dogGroup.rotation.y = Math.PI / 2;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Movimento suave das nuvens ao fundo
            clouds.forEach((cloud) => {
                cloud.position.x += delta * 0.18;
                if (cloud.position.x > 16) cloud.position.x = -16;
            });

            switch (animState) {
                case 'WALK_IN':
                    dogGroup.position.x += delta * 4.5;
                    animateWalking(time, true);

                    if (dogGroup.position.x >= 0) {
                        dogGroup.position.x = 0;
                        animState = 'TURN_TO_FRONT';
                        animTimer = 0;
                    }
                    break;

                case 'TURN_TO_FRONT':
                    animTimer += delta;
                    dogGroup.rotation.y = THREE.MathUtils.lerp(dogGroup.rotation.y, 0, delta * 6);
                    animateIdle(time);

                    if (animTimer >= 0.5) {
                        dogGroup.rotation.y = 0;
                        animState = 'STOP_WAVE_1';
                        animTimer = 0;
                        
                        speechText.textContent = "moça, o jota falou q tu é a melhor";
                        speechBubble.classList.add('show');
                    }
                    break;

                case 'STOP_WAVE_1':
                    animTimer += delta;
                    animateIdle(time);
                    
                    frontRightLeg.rotation.z = Math.sin(time * 12) * 0.6 - 0.6;
                    frontRightLeg.rotation.x = -Math.PI / 3;

                    if (animTimer >= 4.5) {
                        speechBubble.classList.remove('show');
                        frontRightLeg.rotation.set(0, 0, 0);
                        animState = 'TURN_TO_SIDE';
                        animTimer = 0;
                    }
                    break;

                case 'TURN_TO_SIDE':
                    animTimer += delta;
                    dogGroup.rotation.y = THREE.MathUtils.lerp(dogGroup.rotation.y, Math.PI / 2, delta * 6);
                    animateIdle(time);

                    if (animTimer >= 0.5) {
                        dogGroup.rotation.y = Math.PI / 2;
                        animState = 'WALK_OUT';
                    }
                    break;

                case 'WALK_OUT':
                    dogGroup.position.x += delta * 4.5;
                    animateWalking(time, true);

                    if (dogGroup.position.x >= 13) {
                        animState = 'WAIT';
                        animTimer = 0;
                    }
                    break;

                case 'WAIT':
                    animTimer += delta;
                    if (animTimer >= 5.0) {
                        dogGroup.position.x = -13;
                        dogGroup.rotation.y = Math.PI / 2;
                        animState = 'WALK_BACK';
                    }
                    break;

                case 'WALK_BACK':
                    dogGroup.position.x += delta * 4.5;
                    animateWalking(time, true);

                    if (dogGroup.position.x >= 0) {
                        dogGroup.position.x = 0;
                        animState = 'TURN_TO_FRONT_2';
                        animTimer = 0;
                    }
                    break;

                case 'TURN_TO_FRONT_2':
                    animTimer += delta;
                    dogGroup.rotation.y = THREE.MathUtils.lerp(dogGroup.rotation.y, 0, delta * 6);
                    animateIdle(time);

                    if (animTimer >= 0.5) {
                        dogGroup.rotation.y = 0;
                        animState = 'STOP_WAVE_2';
                        animTimer = 0;
                        
                        speechText.textContent = "voce ta aqui ainda? vou falar outra vez... voce é a melhor assim como o jota falou";
                        speechBubble.classList.add('show');
                    }
                    break;

                case 'STOP_WAVE_2':
                    animTimer += delta;
                    animateIdle(time);

                    frontRightLeg.rotation.z = Math.sin(time * 12) * 0.6 - 0.6;
                    frontRightLeg.rotation.x = -Math.PI / 3;
                    break;
            }

            renderer.render(scene, camera);
        }

        function animateWalking(time, isWalking) {
            if (isWalking) {
                bodyGroup.position.y = Math.abs(Math.sin(time * 16)) * 0.15;
                headGroup.rotation.z = Math.sin(time * 8) * 0.05;
                tailGroup.rotation.y = Math.sin(time * 20) * 0.4;

                backLeftLeg.rotation.x = Math.sin(time * 16) * 0.6;
                backRightLeg.rotation.x = -Math.sin(time * 16) * 0.6;
                frontLeftLeg.rotation.x = -Math.sin(time * 16) * 0.6;
                frontRightLeg.rotation.x = Math.sin(time * 16) * 0.6;
            }
        }

        function animateIdle(time) {
            bodyGroup.position.y = Math.sin(time * 4) * 0.05;
            headGroup.rotation.z = 0;
            tailGroup.rotation.y = Math.sin(time * 6) * 0.3;

            backLeftLeg.rotation.set(0, 0, 0);
            backRightLeg.rotation.set(0, 0, 0);
            frontLeftLeg.rotation.set(0, 0, 0);
        }

        window.onload = init;
    </script>
</body>
</html>
